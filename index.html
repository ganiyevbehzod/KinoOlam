<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>KinoOlam Plus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #05080d;
    --card: #0f1620;
    --card-2: #151e2b;
    --text: #f2f4f8;
    --muted: #8a96a8;
    --gold: #f5b301;
    --gold-2: #ffcf4a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }

  header { position: sticky; top: 0; z-index: 10; padding: 12px 16px 10px;
    background: linear-gradient(var(--bg) 85%, transparent); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .brand img { width: 40px; height: 40px; border-radius: 50%; }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .brand h1 span { color: var(--gold); }

  .search { position: relative; }
  .search input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px;
    border: 1px solid #1f2a3a; background: var(--card); color: var(--text);
    font-size: 15px; outline: none; }
  .search input:focus { border-color: var(--gold); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; font-size: 13px;
    background: var(--card); color: var(--muted); border: 1px solid #1f2a3a; cursor: pointer; }
  .chip.active { background: var(--gold); color: #1a1300; border-color: var(--gold); font-weight: 600; }

  main { padding: 6px 16px 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .movie { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer;
    border: 1px solid #172131; transition: transform .12s ease; }
  .movie:active { transform: scale(.97); }
  .poster { aspect-ratio: 2 / 3; position: relative; background-size: cover; background-position: center;
    display: flex; align-items: flex-end; }
  .poster .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 12px; text-align: center; font-weight: 700; font-size: 16px; color: rgba(255,255,255,.9); }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.65); color: var(--gold-2);
    font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
  .code { position: absolute; top: 8px; right: 8px; background: var(--gold); color: #1a1300;
    font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 8px; }
  .meta { padding: 10px 11px 12px; }
  .meta .t { font-size: 14px; font-weight: 600; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .s { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; display: none; }

  /* detail sheet */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 20; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 88vh; overflow-y: auto;
    background: var(--card-2); border-radius: 20px 20px 0 0; transform: translateY(100%);
    transition: transform .25s ease; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .sheet.open { transform: translateY(0); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: #33415a; margin: 10px auto; }
  .sheet .top { display: flex; gap: 14px; padding: 6px 16px 0; }
  .sheet .sp { width: 112px; flex: none; aspect-ratio: 2/3; border-radius: 12px; background-size: cover;
    background-position: center; position: relative; overflow: hidden; }
  .sheet h2 { margin: 2px 0 6px; font-size: 20px; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .tag { font-size: 12px; padding: 4px 9px; border-radius: 8px; background: #0b121b; color: var(--gold-2); }
  .sheet p { color: #c4ccd8; font-size: 14px; line-height: 1.5; padding: 0 16px; margin: 14px 0; }
  .cta { display: block; margin: 8px 16px 0; padding: 14px; border: 0; width: calc(100% - 32px);
    border-radius: 12px; font-size: 16px; font-weight: 700; color: #1a1300; cursor: pointer;
    background: linear-gradient(135deg, var(--gold-2), var(--gold)); }
  .cta.sec { background: #1a2433; color: var(--text); margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="KinoOlam Plus" onerror="this.style.display='none'">
    <h1>Kino<span>Olam</span> Plus</h1>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Kino nomi yoki kodi bo'yicha qidirish" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Hech narsa topilmadi</div>
</main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="top">
    <div class="sp" id="sPoster"></div>
    <div>
      <h2 id="sTitle"></h2>
      <div class="tags" id="sTags"></div>
    </div>
  </div>
  <p id="sDesc"></p>
  <button class="cta" id="watch">Botda ko'rish</button>
  <button class="cta sec" id="close">Yopish</button>
</div>

<script>
// ============ SOZLAMALAR ============
const BOT_USERNAME = "KinoOlamPlus_bot";   // @ belgisiz

// Kinolarni shu yerda tahrirlang.
// code  — botdagi kino kodi (bot /start kino_KOD ni qabul qilishi kerak)
// poster — rasm havolasi (https://...) yoki "" bo'lsa rangli fon ko'rsatiladi
const MOVIES = [
  { code: "101", title: "Namuna kino 1", year: 2024, genre: ["Jangari", "Drama"],    rating: 8.1, poster: "", desc: "Bu namuna matni. Kino haqida qisqacha ma'lumotni shu yerga yozing." },
  { code: "102", title: "Namuna kino 2", year: 2023, genre: ["Komediya"],             rating: 7.4, poster: "", desc: "Bu namuna matni. Kino haqida qisqacha ma'lumotni shu yerga yozing." },
  { code: "103", title: "Namuna kino 3", year: 2025, genre: ["Fantastika", "Jangari"], rating: 8.6, poster: "", desc: "Bu namuna matni. Kino haqida qisqacha ma'lumotni shu yerga yozing." },
  { code: "104", title: "Namuna kino 4", year: 2022, genre: ["Drama", "Melodrama"],   rating: 7.9, poster: "", desc: "Bu namuna matni. Kino haqida qisqacha ma'lumotni shu yerga yozing." },
  { code: "105", title: "Namuna kino 5", year: 2024, genre: ["Qo'rqinchli"],          rating: 6.8, poster: "", desc: "Bu namuna matni. Kino haqida qisqacha ma'lumotni shu yerga yozing." },
  { code: "106", title: "Namuna kino 6", year: 2021, genre: ["Multfilm"],             rating: 8.0, poster: "", desc: "Bu namuna matni. Kino haqida qisqacha ma'lumotni shu yerga yozing." },
];
// ====================================

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#05080d"); tg.setBackgroundColor("#05080d"); } catch (e) {}
}

const $ = (id) => document.getElementById(id);
const grid = $("grid"), chipsEl = $("chips"), qEl = $("q");
let activeGenre = "Hammasi";
let current = null;

const GRADS = [
  "linear-gradient(160deg,#1d3557,#0b132b)", "linear-gradient(160deg,#5a189a,#10002b)",
  "linear-gradient(160deg,#9d0208,#370617)", "linear-gradient(160deg,#006466,#0b2a2b)",
  "linear-gradient(160deg,#7f5539,#2b1d12)", "linear-gradient(160deg,#3a5a40,#14221a)",
];
const bgFor = (m, i) => m.poster ? `url("${m.poster}")` : GRADS[i % GRADS.length];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const genres = ["Hammasi", ...Array.from(new Set(MOVIES.flatMap((m) => m.genre)))];
chipsEl.innerHTML = genres.map((g) => `<div class="chip${g === activeGenre ? " active" : ""}" data-g="${esc(g)}">${esc(g)}</div>`).join("");
chipsEl.addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  activeGenre = c.dataset.g;
  chipsEl.querySelectorAll(".chip").forEach((x) => x.classList.toggle("active", x === c));
  render();
});
qEl.addEventListener("input", render);

function render() {
  const q = qEl.value.trim().toLowerCase();
  const list = MOVIES.filter((m) =>
    (activeGenre === "Hammasi" || m.genre.includes(activeGenre)) &&
    (!q || m.title.toLowerCase().includes(q) || String(m.code).includes(q)));
  grid.innerHTML = list.map((m) => {
    const i = MOVIES.indexOf(m);
    return `<div class="movie" data-i="${i}">
      <div class="poster" style="background-image:${bgFor(m, i)}">
        ${m.poster ? "" : `<div class="ph">${esc(m.title)}</div>`}
        <span class="badge">★ ${m.rating}</span><span class="code">#${esc(m.code)}</span>
      </div>
      <div class="meta"><div class="t">${esc(m.title)}</div>
      <div class="s">${m.year} · ${esc(m.genre[0])}</div></div></div>`;
  }).join("");
  $("empty").style.display = list.length ? "none" : "block";
}
grid.addEventListener("click", (e) => {
  const c = e.target.closest(".movie"); if (!c) return;
  openSheet(MOVIES[+c.dataset.i], +c.dataset.i);
});

function openSheet(m, i) {
  current = m;
  $("sPoster").style.backgroundImage = bgFor(m, i);
  $("sTitle").textContent = m.title;
  $("sTags").innerHTML = [m.year, ...m.genre, "★ " + m.rating, "Kod: " + m.code]
    .map((t) => `<span class="tag">${esc(t)}</span>`).join("");
  $("sDesc").textContent = m.desc;
  $("overlay").classList.add("open");
  $("sheet").classList.add("open");
  if (tg) { tg.BackButton.show(); }
}
function closeSheet() {
  $("overlay").classList.remove("open");
  $("sheet").classList.remove("open");
  if (tg) { tg.BackButton.hide(); }
}
$("overlay").addEventListener("click", closeSheet);
$("close").addEventListener("click", closeSheet);
if (tg) tg.BackButton.onClick(closeSheet);

$("watch").addEventListener("click", () => {
  if (!current) return;
  const url = `https://t.me/${BOT_USERNAME}?start=kino_${encodeURIComponent(current.code)}`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
});

render();
</script>
</body>
</html>
